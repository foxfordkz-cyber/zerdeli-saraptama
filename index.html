<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zerdeli Сараптама</title>
    <meta name="description" content="Zerdeli Group бағдарламаларының жобаларын оқып, дауыспен немесе мәтінмен пікір қалдыру." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6E78'/%3E%3Cpath d='M10 10h12l-12 12h12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem('zerdeli.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('zerdeli.lang');
        if (l === 'ru' || l === 'kk') document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
